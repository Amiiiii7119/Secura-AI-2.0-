<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_15 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_15" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_15');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Interactive 3D RGB Photoplethysmography (rPPG) Heart & Waveform Component
const width = container.clientWidth || 360;
const height = container.clientHeight || 360;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 14);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
container.appendChild(renderer.domElement);

// Heart 2D Shape definition for extrusion and curve piping
const x = 0, y = 0;
const heartShape = new THREE.Shape();
heartShape.moveTo(x + 2.5, y + 2.5);
heartShape.bezierCurveTo(x + 2.5, y + 2.5, x + 2.0, y, x, y);
heartShape.bezierCurveTo(x - 3.0, y, x - 3.0, y + 3.5, x - 3.0, y + 3.5);
heartShape.bezierCurveTo(x - 3.0, y + 5.5, x - 1.0, y + 7.7, x + 2.5, y + 9.5);
heartShape.bezierCurveTo(x + 6.0, y + 7.7, x + 8.0, y + 5.5, x + 8.0, y + 3.5);
heartShape.bezierCurveTo(x + 8.0, y + 3.5, x + 8.0, y, x + 5.0, y);
heartShape.bezierCurveTo(x + 3.5, y, x + 2.5, y + 2.5, x + 2.5, y + 2.5);

// Create points along the perimeter for glowing RGB multi-channel ribbons
const points = heartShape.getSpacedPoints(180);
// Center points around origin
const centeredPoints = points.map(p => new THREE.Vector3((p.x - 2.5), -(p.y - 4.8), 0));

// Create smooth closed 3D curves for Red, Green, and Blue temporal harmonic channels
function createChannelTube(pointsList, offsetZ, colorHex, radius, opacity) {
  const curvePoints = pointsList.map(p => new THREE.Vector3(p.x * 0.95, p.y * 0.95, offsetZ));
  const curve = new THREE.CatmullRomCurve3(curvePoints, true);
  const tubeGeo = new THREE.TubeGeometry(curve, 180, radius, 12, true);
  const mat = new THREE.MeshPhongMaterial({
    color: colorHex,
    emissive: colorHex,
    emissiveIntensity: 0.45,
    transparent: true,
    opacity: opacity,
    shininess: 90
  });
  return new THREE.Mesh(tubeGeo, mat);
}

// Group to hold the entire cardiac model
const heartGroup = new THREE.Group();
scene.add(heartGroup);

// Main translucent glass heart core (representing cardiac volume)
const extrudeSettings = { depth: 1.2, bevelEnabled: true, bevelSegments: 6, steps: 2, bevelSize: 0.6, bevelThickness: 0.6 };
const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
heartGeometry.center();

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xfdfaf6,
  metalness: 0.05,
  roughness: 0.2,
  transmission: 0.88,
  thickness: 1.5,
  transparent: true,
  opacity: 0.82,
  reflectivity: 0.6,
  clearcoat: 0.8,
  clearcoatRoughness: 0.1
});
const heartMesh = new THREE.Mesh(heartGeometry, glassMaterial);
heartMesh.rotation.z = Math.PI; // Orient apex pointing down
heartMesh.scale.set(0.72, 0.72, 0.72);
heartGroup.add(heartMesh);

// 3 RGB Spectral Bands wrapping around the heart (Channel R: warm crimson/orange, G: bio-green rPPG, B: cyan/blue)
const redChannel = createChannelTube(centeredPoints, 0.4, 0xef4444, 0.08, 0.95);    // Red channel (HbO2 absorption)
const greenChannel = createChannelTube(centeredPoints, 0.0, 0x10b981, 0.09, 0.98);  // Green channel (Hemodynamic peak rPPG)
const blueChannel = createChannelTube(centeredPoints, -0.4, 0x0ea5e9, 0.08, 0.90);   // Blue channel (Surface reference)
heartGroup.add(redChannel);
heartGroup.add(greenChannel);
heartGroup.add(blueChannel);

// Floating optical probe particle ring (photons & latent signals)
const particleCount = 48;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
const pColors = new Float32Array(particleCount * 3);
const channelPalette = [
  [0.93, 0.26, 0.26], // R
  [0.06, 0.72, 0.50], // G
  [0.05, 0.64, 0.91]  // B
];

for(let i = 0; i < particleCount; i++) {
  const angle = (i / particleCount) * Math.PI * 2;
  const radius = 5.2 + (Math.random() - 0.5) * 1.2;
  pPos[i*3] = Math.cos(angle) * radius;
  pPos[i*3+1] = Math.sin(angle) * radius;
  pPos[i*3+2] = (Math.random() - 0.5) * 2.0;

  const col = channelPalette[i % 3];
  pColors[i*3] = col[0];
  pColors[i*3+1] = col[1];
  pColors[i*3+2] = col[2];
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

const pMat = new THREE.PointsMaterial({
  size: 0.18,
  vertexColors: true,
  transparent: true,
  opacity: 0.75,
  blending: THREE.AdditiveBlending
});
const particles = new THREE.Points(pGeo, pMat);
heartGroup.add(particles);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xffa250, 1.4);
dirLight1.position.set(5, 8, 6);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 1.0);
dirLight2.position.set(-6, -4, 4);
scene.add(dirLight2);

// Mouse interaction
let mouseX = 0, mouseY = 0;
let targetX = 0, targetY = 0;

function onMouseMove(event) {
  const rect = container.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  mouseX = (x / (rect.width || 1) - 0.5) * 2;
  mouseY = (y / (rect.height || 1) - 0.5) * 2;
}
window.addEventListener('mousemove', onMouseMove);

// Animation Loop (Simulating realistic systolic-diastolic heartbeat pulsation)
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Cardiac cycle: double pulse rhythm (systole + dicrotic wave)
  const bpmRate = 1.1; // ~66 bpm
  const cycle = (time * bpmRate) % 1.0;
  let pulse = 0;
  if (cycle < 0.18) {
    pulse = Math.sin((cycle / 0.18) * Math.PI) * 0.14;
  } else if (cycle > 0.24 && cycle < 0.40) {
    pulse = Math.sin(((cycle - 0.24) / 0.16) * Math.PI) * 0.06;
  }

  // Smooth rotation & interactive tilt
  targetX += (mouseX * 0.45 - targetX) * 0.05;
  targetY += (mouseY * 0.45 - targetY) * 0.05;

  heartGroup.rotation.y = Math.sin(time * 0.6) * 0.28 + targetX;
  heartGroup.rotation.x = Math.cos(time * 0.5) * 0.15 - targetY;
  heartGroup.rotation.z = Math.sin(time * 0.4) * 0.05;

  const baseScale = 1.0 + pulse;
  heartMesh.scale.set(0.72 * baseScale, 0.72 * baseScale, 0.72 * (1.0 + pulse * 1.4));
  
  // Independent channel micro-waves
  redChannel.scale.set(1.0 + pulse * 1.1, 1.0 + pulse * 1.1, 1.0);
  greenChannel.scale.set(1.0 + pulse * 1.3, 1.0 + pulse * 1.3, 1.0);
  blueChannel.scale.set(1.0 + pulse * 0.9, 1.0 + pulse * 0.9, 1.0);

  // Particles orbit
  particles.rotation.z = time * 0.2;
  particles.rotation.y = time * 0.15;

  renderer.render(scene, camera);
}
animate();

// Resize observer
const resizeObserver = new ResizeObserver(() => {
  const w = container.clientWidth || 360;
  const h = container.clientHeight || 360;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
resizeObserver.observe(container);

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_15 -->
</body>
</html>
