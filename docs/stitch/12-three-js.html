<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_17 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_17" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_17');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Apple Pro Design Inspired 3D RGB Photoplethysmography (rPPG) Cardioid Diagnostic Engine
const width = container.clientWidth || 400;
const height = container.clientHeight || 400;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
camera.position.set(0, 0.5, 13);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

// Smooth Cardioid curve shape
const heartShape = new THREE.Shape();
const x = 0, y = 0;
heartShape.moveTo(x + 2.5, y + 2.5);
heartShape.bezierCurveTo(x + 2.5, y + 2.5, x + 2.0, y, x, y);
heartShape.bezierCurveTo(x - 3.0, y, x - 3.0, y + 3.5, x - 3.0, y + 3.5);
heartShape.bezierCurveTo(x - 3.0, y + 5.5, x - 1.0, y + 7.7, x + 2.5, y + 9.5);
heartShape.bezierCurveTo(x + 6.0, y + 7.7, x + 8.0, y + 5.5, x + 8.0, y + 3.5);
heartShape.bezierCurveTo(x + 8.0, y + 3.5, x + 8.0, y, x + 5.0, y);
heartShape.bezierCurveTo(x + 3.5, y, x + 2.5, y + 2.5, x + 2.5, y + 2.5);

const points = heartShape.getSpacedPoints(200);
const centeredPoints = points.map(p => new THREE.Vector3((p.x - 2.5), -(p.y - 4.8), 0));

// Apple Frosted Glass Translucent Heart Core
const extrudeSettings = { 
  depth: 1.1, 
  bevelEnabled: true, 
  bevelSegments: 8, 
  steps: 2, 
  bevelSize: 0.55, 
  bevelThickness: 0.55 
};
const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
heartGeometry.center();

// Apple Pro Frosted Glass Core with prismatic refraction simulation
const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0.02,
  roughness: 0.12,
  transmission: 0.92,
  thickness: 2.2,
  transparent: true,
  opacity: 0.88,
  ior: 1.48,
  reflectivity: 0.8,
  clearcoat: 1.0,
  clearcoatRoughness: 0.08
});

const heartGroup = new THREE.Group();
scene.add(heartGroup);

const heartMesh = new THREE.Mesh(heartGeometry, glassMaterial);
heartMesh.rotation.z = Math.PI;
heartMesh.scale.set(0.68, 0.68, 0.68);
heartGroup.add(heartMesh);

// Function to create sleek, high-precision luminous optic ribbons
function createSpectralRibbon(pts, offsetZ, hexColor, emissiveColor, radius, opacity) {
  const curvePts = pts.map(p => new THREE.Vector3(p.x * 0.96, p.y * 0.96, offsetZ));
  const curve = new THREE.CatmullRomCurve3(curvePts, true);
  const geo = new THREE.TubeGeometry(curve, 220, radius, 16, true);
  const mat = new THREE.MeshPhysicalMaterial({
    color: hexColor,
    emissive: emissiveColor,
    emissiveIntensity: 0.85,
    roughness: 0.2,
    metalness: 0.1,
    clearcoat: 1.0,
    transparent: true,
    opacity: opacity
  });
  return new THREE.Mesh(geo, mat);
}

// 3 RGB Spectral Harmonic Waveguides (Apple Color Calibration: Crimson R, Bio Emerald G, Studio Cyan B)
const redBand = createSpectralRibbon(centeredPoints, 0.42, 0xff3b30, 0xff2d55, 0.085, 0.96);    // R: 660nm HbO2
const greenBand = createSpectralRibbon(centeredPoints, 0.0, 0x34c759, 0x30d158, 0.095, 0.98);   // G: 525nm rPPG Hemodynamic
const blueBand = createSpectralRibbon(centeredPoints, -0.42, 0x007aff, 0x5856d6, 0.085, 0.94);  // B: 470nm Surface Ref
heartGroup.add(redBand);
heartGroup.add(greenBand);
heartGroup.add(blueBand);

// Sub-orbital optical data rings & photon dust
const particleCount = 64;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
const pColors = new Float32Array(particleCount * 3);

const appleRgbPalette = [
  [1.0, 0.23, 0.19], // Apple Red (#FF3B30)
  [0.2, 0.78, 0.35], // Apple Green (#34C759)
  [0.0, 0.48, 1.0]   // Apple Blue (#007AFF)
];

for(let i = 0; i < particleCount; i++) {
  const theta = (i / particleCount) * Math.PI * 2;
  const rad = 4.8 + (Math.sin(i * 3.5) * 0.7);
  pPos[i*3] = Math.cos(theta) * rad;
  pPos[i*3+1] = Math.sin(theta) * rad;
  pPos[i*3+2] = (Math.cos(i * 2.1)) * 1.5;

  const col = appleRgbPalette[i % 3];
  pColors[i*3] = col[0];
  pColors[i*3+1] = col[1];
  pColors[i*3+2] = col[2];
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

const pMat = new THREE.PointsMaterial({
  size: 0.16,
  vertexColors: true,
  transparent: true,
  opacity: 0.8,
  blending: THREE.AdditiveBlending
});
const particles = new THREE.Points(pGeo, pMat);
heartGroup.add(particles);

// Studio-grade lighting setup
const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(6, 9, 8);
scene.add(keyLight);

const rimLightOrange = new THREE.DirectionalLight(0xff9500, 1.8);
rimLightOrange.position.set(-8, -4, 5);
scene.add(rimLightOrange);

const rimLightCyan = new THREE.DirectionalLight(0x5ac8fa, 1.6);
rimLightCyan.position.set(4, -8, -6);
scene.add(rimLightCyan);

const ambientLight = new THREE.AmbientLight(0xffffff, 1.1);
scene.add(ambientLight);

// Interactive smooth inertia pointer tracking
let mouseX = 0, mouseY = 0;
let targetX = 0, targetY = 0;

function handleMove(e) {
  const rect = container.getBoundingClientRect();
  const clX = e.clientX || (e.touches && e.touches[0].clientX) || rect.left + rect.width / 2;
  const clY = e.clientY || (e.touches && e.touches[0].clientY) || rect.top + rect.height / 2;
  mouseX = ((clX - rect.left) / (rect.width || 1) - 0.5) * 2;
  mouseY = ((clY - rect.top) / (rect.height || 1) - 0.5) * 2;
}
window.addEventListener('mousemove', handleMove, { passive: true });
window.addEventListener('touchmove', handleMove, { passive: true });

// Animation Loop: Biophysical systolic/diastolic dual pulsation
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Apple Watch ECG rhythmic cadence
  const bpm = 1.05; // 63 BPM rest
  const phase = (t * bpm) % 1.0;
  let pulse = 0;
  if (phase < 0.16) {
    pulse = Math.sin((phase / 0.16) * Math.PI) * 0.12;
  } else if (phase > 0.22 && phase < 0.38) {
    pulse = Math.sin(((phase - 0.22) / 0.16) * Math.PI) * 0.05;
  }

  // Apple Pro fluid inertia
  targetX += (mouseX * 0.38 - targetX) * 0.06;
  targetY += (mouseY * 0.38 - targetY) * 0.06;

  heartGroup.rotation.y = Math.sin(t * 0.45) * 0.22 + targetX;
  heartGroup.rotation.x = Math.cos(t * 0.4) * 0.12 - targetY;
  heartGroup.rotation.z = Math.sin(t * 0.3) * 0.04;

  const currentScale = 0.68 * (1.0 + pulse);
  heartMesh.scale.set(currentScale, currentScale, currentScale * (1.0 + pulse * 1.3));

  // Dynamic band micro-expansion
  redBand.scale.set(1.0 + pulse * 1.15, 1.0 + pulse * 1.15, 1.0);
  greenBand.scale.set(1.0 + pulse * 1.35, 1.0 + pulse * 1.35, 1.0);
  blueBand.scale.set(1.0 + pulse * 0.95, 1.0 + pulse * 0.95, 1.0);

  // Particles fluid precession
  particles.rotation.z = t * 0.18;
  particles.rotation.y = t * 0.12;

  renderer.render(scene, camera);
}
animate();

const ro = new ResizeObserver(() => {
  const w = container.clientWidth || 400;
  const h = container.clientHeight || 400;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
ro.observe(container);

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_17 -->
</body>
</html>
